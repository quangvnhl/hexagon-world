# Dựng image Docker thật — bước còn thiếu giữa "CI xanh" và "deploy được" (doc 35 §C5).
#
# ┌─ VÌ SAO CẦN JOB NÀY ────────────────────────────────────────────────────────────────────────┐
# │ `Dockerfile` là artifact triển khai DUY NHẤT của repo, và cho tới lát này nó CHƯA TỪNG được  │
# │ dựng ở đâu cả. Job `CI` chạy typecheck/test/build trên runner, không qua Docker — nên mọi     │
# │ thứ chỉ hỏng bên trong image đều đi lọt tới lần deploy đầu tiên.                              │
# │                                                                                              │
# │ Đó không phải rủi ro giả định: `packages/admin` thiếu manifest trong Dockerfile đã nằm im     │
# │ trong repo cho tới khi có người ĐỌC ra nó (PR #48). Một bài test tĩnh giữ đúng lỗi ĐÓ, nhưng  │
# │ nó chỉ đọc chữ trong Dockerfile — nó không biết `pnpm install` có chạy nổi không, `next       │
# │ build` trong image có ra `.next/standalone` không, hay `COPY --from` có đặt file đúng chỗ      │
# │ `CMD` trỏ tới không. Ba thứ đó chỉ có một cách biết: dựng thật.                                │
# └─────────────────────────────────────────────────────────────────────────────────────────────┘
#
# KHÔNG đẩy lên registry (`push: false`), không secret, không chạm nhà cung cấp nào. Job này chỉ
# trả lời một câu: image có dựng được và có đúng hình dạng không.
name: Docker image

on:
  push:
    branches: [main]
  # Chỉ chạy trên PR đụng tới thứ ẢNH HƯỞNG tới image. Dựng hai image tốn vài phút, và mã nguồn
  # thường đã được `pnpm build` trong job CI che rồi — thứ job CI KHÔNG che là đúng danh sách này.
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '**/package.json'
      - 'packages/client/next.config.mjs'
      - '.github/workflows/image.yml'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Hai stage đích được dựng RIÊNG chứ không dựng cả file: chúng chia chung stage
      # `dependencies`, nên lần thứ hai lấy lại từ cache thay vì cài lại phụ thuộc.
      - name: Dựng image server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          tags: hexworld-server:ci
          push: false
          load: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Dựng image client
        uses: docker/build-push-action@v6
        with:
          context: .
          target: client
          tags: hexworld-client:ci
          push: false
          load: true
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      # Dựng được KHÔNG có nghĩa là chạy được. `COPY --from` đặt file sai chỗ thì image vẫn dựng
      # xanh và chỉ chết lúc khởi động, với một dòng MODULE_NOT_FOUND trên production.
      # Hai bước dưới kiểm đúng đường dẫn mà `CMD` sẽ gọi tới.
      # Đường dẫn `@hexagon/shared` là đường dẫn pnpm thật, không phải chỗ đoán: pnpm KHÔNG đặt
      # gói workspace ở `node_modules` gốc mà đặt link trong `node_modules` của chính gói dùng nó
      # (`packages/server/node_modules/@hexagon/shared -> ../../../shared`). Đây cũng đúng đường
      # Node sẽ giải khi chạy, nên nó bắt luôn cả trường hợp `shared` chưa được build.
      - name: Server — file mà CMD trỏ tới phải tồn tại
        run: |
          docker run --rm hexworld-server:ci node -e "
            require('node:fs').statSync('/app/packages/server/dist/main.js');
            require('node:fs').statSync('/app/packages/server/node_modules/@hexagon/shared/dist/index.js');
            console.log('ok');
          "

      # `output: "standalone"` + `outputFileTracingRoot` ở gốc workspace đặt server của client tại
      # packages/client/server.js trong cây standalone. `.next/static` và `public` KHÔNG nằm trong
      # cây đó — Next cố ý để người dựng image tự copy, và quên là image chạy được nhưng mất sạch
      # CSS/JS/asset. Không có bước này thì lỗi đó trông giống hệt một trang trắng.
      # ┌─ BAI DUY NHAT O DAY CHAY CA HE, VA NO KIEM DUNG MOT THU ─────────────────────────────┐
      # │ `scripts/compose.test.mjs` khang dinh volume spool la volume CO TEN — nhung no doc     │
      # │ VAN BAN cua file compose. "File con do sau khi deploy lai" thi chi Docker moi tra loi  │
      # │ duoc, va do la bat bien dat nhat trong he: moi file trong thu muc do la XP va tien cua │
      # │ mot nguoi choi chua ghi duoc vao control plane.                                        │
      # │                                                                                       │
      # │ Buoc nay chung minh CA HAI CHIEU: `down` giu file lai, `down -v` xoa no. Neu chi kiem  │
      # │ chieu giu thi mot bai test doc nham thu muc khac cung se xanh.                         │
      # └─────────────────────────────────────────────────────────────────────────────────────┘
      - name: Volume spool sống sót qua một lần deploy lại
        working-directory: deploy
        env:
          IMAGE_SERVER: hexworld-server:ci
          IMAGE_CLIENT: hexworld-client:ci
          DOMAIN: localhost
          API_DOMAIN: api.localhost
          GAME_DOMAIN: game.localhost
        run: |
          set -eu
          # env rỗng từ file mẫu: bước này không khởi động ứng dụng, chỉ dùng chính service
          # `game` làm chỗ đứng để ghi/đọc trong volume.
          cp control.env.example control.env
          cp game.env.example game.env

          ghi() { docker compose run --rm --entrypoint sh game -c "$1"; }

          ghi 'mkdir -p /app/data/match-results && echo tien-cua-nguoi-choi > /app/data/match-results/tran-1.json'

          # `down` không kèm -v = đúng thứ một lần deploy lại làm.
          docker compose down
          noi_dung=$(ghi 'cat /app/data/match-results/tran-1.json')
          test "$noi_dung" = "tien-cua-nguoi-choi" || { echo "MAT DU LIEU: đọc ra '$noi_dung'"; exit 1; }
          echo "giữ được sau khi deploy lại"

          # Chiều ngược lại: `down -v` PHẢI xoá. Không kiểm chiều này thì một bài đọc nhầm
          # đường dẫn cũng sẽ xanh.
          docker compose down -v
          if ghi 'test -f /app/data/match-results/tran-1.json'; then
            echo "down -v lẽ ra phải xoá volume — phép kiểm trên không chứng minh được gì"
            exit 1
          fi
          echo "down -v xoá đúng như mong đợi ⇒ phép kiểm trên có nghĩa"

      - name: Client — server.js, static và public phải tồn tại
        run: |
          docker run --rm hexworld-client:ci node -e "
            const fs = require('node:fs');
            fs.statSync('/app/packages/client/server.js');
            fs.statSync('/app/packages/client/.next/static');
            fs.statSync('/app/packages/client/public');
            console.log('ok');
          "
