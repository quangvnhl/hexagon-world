name: hexagon-world

services:
  server:
    image: hexagon-world-server:local
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8910"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      SUPABASE_DB_URL: "${SUPABASE_DB_URL:-}"
      SUPABASE_DB_SCHEMA: "${SUPABASE_DB_SCHEMA:-public}"
      SUPABASE_REQUEST_TIMEOUT_MS: "${SUPABASE_REQUEST_TIMEOUT_MS:-5000}"
      SUPABASE_PERSISTENCE_REQUIRED: "${SUPABASE_PERSISTENCE_REQUIRED:-false}"
      PLAYER_SESSION_SECRET: "${PLAYER_SESSION_SECRET:-}"
      PLAYER_SESSION_TTL_SECONDS: "${PLAYER_SESSION_TTL_SECONDS:-86400}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      GOOGLE_OAUTH_REDIRECT_URI: "${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8910/v1/auth/web/google/callback}"
      GOOGLE_OAUTH_POST_LOGIN_REDIRECT_URI: "${GOOGLE_OAUTH_POST_LOGIN_REDIRECT_URI:-http://localhost:3890}"
      GOOGLE_OAUTH_SCOPES: "${GOOGLE_OAUTH_SCOPES:-openid email profile}"
      GOOGLE_OAUTH_STATE_SECRET: "${GOOGLE_OAUTH_STATE_SECRET:-}"
      GOOGLE_OAUTH_STATE_TTL_SECONDS: "${GOOGLE_OAUTH_STATE_TTL_SECONDS:-600}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: "${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-86400}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      TELEGRAM_STARS_ENABLED: "${TELEGRAM_STARS_ENABLED:-true}"
      PLAYER_SOURCE_DEFAULT: "${PLAYER_SOURCE_DEFAULT:-web}"
      PLAYER_SOURCE_ALLOWLIST: "${PLAYER_SOURCE_ALLOWLIST:-web,telegram}"
      SHOP_DEFAULT_CURRENCY: "${SHOP_DEFAULT_CURRENCY:-coin}"
      SHOP_CATALOG_CACHE_TTL_SECONDS: "${SHOP_CATALOG_CACHE_TTL_SECONDS:-60}"
      SHOP_PURCHASE_IDEMPOTENCY_TTL_SECONDS: "${SHOP_PURCHASE_IDEMPOTENCY_TTL_SECONDS:-86400}"
      DEFAULT_FREE_ITEMS_PER_CATEGORY: "${DEFAULT_FREE_ITEMS_PER_CATEGORY:-1}"
      DEFAULT_FREE_COLOR_ASSET_KEY: "${DEFAULT_FREE_COLOR_ASSET_KEY:-color:0}"
      DEFAULT_FREE_SHAPE_ASSET_KEY: "${DEFAULT_FREE_SHAPE_ASSET_KEY:-shape:cube}"
      DEFAULT_FREE_TRAIL_ASSET_KEY: "${DEFAULT_FREE_TRAIL_ASSET_KEY:-trail:solid}"
      MATCH_HISTORY_RETENTION_DAYS: "${MATCH_HISTORY_RETENTION_DAYS:-30}"
      ADMIN_API_KEY_SHA256: "${ADMIN_API_KEY_SHA256:-}"
      GAME_RESULT_SECRET: "${GAME_RESULT_SECRET:-}"
      GAME_RESULT_SPOOL_DIR: "${GAME_RESULT_SPOOL_DIR:-/app/data/match-results}"
      SERVER_ROLE: "${SERVER_ROLE:-all}"
      GAME_REGION: "${GAME_REGION:-local}"
      CONTROL_PLANE_URL: "${CONTROL_PLANE_URL:-http://localhost:8910}"
      GAME_PUBLIC_WS_URL: "${GAME_PUBLIC_WS_URL:-ws://localhost:8910/game}"
      GAME_PUBLIC_PING_URL: "${GAME_PUBLIC_PING_URL:-http://localhost:8910/health/ping}"
      GAME_REGIONS_JSON: "${GAME_REGIONS_JSON:-}"
      REGION_TICKET_PRIVATE_KEY_BASE64: "${REGION_TICKET_PRIVATE_KEY_BASE64:-}"
      REGION_TICKET_PUBLIC_KEY_BASE64: "${REGION_TICKET_PUBLIC_KEY_BASE64:-}"
      REGION_TICKET_TTL_SECONDS: "${REGION_TICKET_TTL_SECONDS:-60}"
    ports:
      # Chỉ publish trên localhost của máy host; server trong container vẫn
      # phải lắng nghe mọi interface để Docker chuyển tiếp được lưu lượng.
      - "127.0.0.1:${SERVER_PORT:-8910}:8910"
    volumes:
      - server-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8910/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    image: hexagon-world-client:local
    build:
      context: .
      dockerfile: Dockerfile
      target: client
      args:
        # This URL is used by the user's browser, not by the client container.
        NEXT_PUBLIC_SERVER_URL: "${NEXT_PUBLIC_SERVER_URL:-ws://localhost:8910}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8910}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3890"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3890}:3890"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3890').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  server-data:
