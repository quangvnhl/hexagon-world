name: hexagon-world

services:
  server:
    image: hexagon-world-server:local
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
    ports:
      - "${SERVER_PORT:-8787}:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require('net');const s=net.connect(8787,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    image: hexagon-world-client:local
    build:
      context: .
      dockerfile: Dockerfile
      target: client
      args:
        # This URL is used by the user's browser, not by the client container.
        NEXT_PUBLIC_SERVER_URL: "${NEXT_PUBLIC_SERVER_URL:-ws://localhost:8787}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
