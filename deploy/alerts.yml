# doc 35 §C1 — luật cảnh báo Prometheus tối thiểu.
#
# ┌─ MỘT ALERT KHÔNG CÓ RUNBOOK LÀ MỘT ALERT SẼ BỊ TẮT ────────────────────────────────────────────┐
# │ Mỗi luật dưới đây bắt buộc có `annotations.runbook`. Người bị đánh thức lúc 2 giờ sáng cần      │
# │ biết PHẢI LÀM GÌ, không phải biết một con số vừa vượt ngưỡng. Thêm luật mới mà không có runbook │
# │ thì đừng thêm.                                                                                  │
# └────────────────────────────────────────────────────────────────────────────────────────────────┘
#
# Ngưỡng lấy từ SLO ở doc 26 §2, trừ hai chỗ ghi rõ là chọn theo hậu quả chứ không theo SLO.
# Runbook: .implements/39-runbook-phat-hanh-rollback.md và .implements/11-player-backend-runbook.md

groups:
  # ==============================================================================================
  # TIỀN VÀ DỮ LIỆU NGƯỜI CHƠI — nhóm này đánh thức người, hai nhóm dưới thì không
  # ==============================================================================================
  - name: hexagon-money
    rules:
      # Mỗi file tồn là XP và tiền của một người chơi đang nằm chờ. Game vẫn chạy bình thường trong
      # lúc này, nên KHÔNG có gì khác đỏ lên — đó chính là lý do phải có luật này.
      - alert: SpoolBacklogGrowing
        expr: hexworld_spool_pending > 20
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "{{ $value }} kết quả trận chưa ghi được vào control plane"
          description: >-
            Control plane không nhận kết quả trận. Người chơi đang chơi bình thường nhưng KHÔNG
            nhận được XP và tiền. Số này chỉ giảm khi control plane trả 2xx trở lại.
          runbook: >-
            1) Kiểm /health/ready của control plane — database=true?
            2) Xem log control plane tìm 5xx ở POST /internal/v1/match-results.
            3) Spool tự gửi lại với backoff tới 60s, KHÔNG cần can thiệp tay khi control plane trở lại.
            4) TUYỆT ĐỐI không xoá file trong GAME_RESULT_SPOOL_DIR — mỗi file là tiền của một người.
            5) Nếu tiến trình game sắp khởi động lại, xác nhận thư mục nằm trên volume BỀN trước đã.

      # Ngưỡng 0 có chủ ý: bất kỳ ngoại lệ nào thoát ra khỏi webhook đều là chuyện phải nhìn. Người
      # chơi ĐÃ bị trừ Stars; Telegram sẽ gửi lại, và nếu lần nào cũng lỗi thì họ mất tiền thật.
      # Pre-checkout bị từ chối KHÔNG được đếm vào đây (order hết hạn, sai tài khoản = nghiệp vụ đúng).
      - alert: TelegramWebhookFailing
        expr: increase(hexworld_telegram_webhook_failures_total[15m]) > 0
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "Webhook Telegram Stars ném lỗi {{ $value }} lần / 15 phút"
          description: >-
            Người chơi đã bị trừ Stars nhưng xử lý webhook ném ngoại lệ. Telegram sẽ gửi lại, nên
            một lần lẻ có thể tự khỏi; lặp lại nghĩa là có người mất tiền mà chưa nhận coin.
          runbook: >-
            1) Tìm log của POST /v1/payments/webhooks/telegram quanh thời điểm alert.
            2) Đối chiếu purchase_orders theo telegram_payment_charge_id — order còn 'pending'?
            3) Order đã trả tiền mà chưa fulfilled thì xử bằng Ops API, KHÔNG sửa tay trong SQL.
            4) Nếu là lỗi hệ thống kéo dài: doc 18 §refund — hoàn Stars còn hơn để người chơi mất tiền.

  # ==============================================================================================
  # KHẢ DỤNG
  # ==============================================================================================
  - name: hexagon-availability
    rules:
      # `-1` = chưa kiểm bao giờ (server vừa khởi động) — CỐ Ý không kêu, nếu không thì mỗi lần
      # deploy là một lần báo động giả, và báo động giả lặp lại là cách chắc nhất để alert bị tắt.
      - alert: DatabaseUnreachable
        expr: hexworld_db_ready == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Control plane không nối được database"
          description: "/health/ready trả database=false liên tục 2 phút."
          runbook: >-
            1) Kiểm trạng thái Supabase project (dashboard → Database).
            2) Kiểm SUPABASE_URL / SUPABASE_SECRET_KEY chưa hết hạn hay bị xoay vòng.
            3) Còn kết nối rỗi không — pooler có đang cạn slot?
            4) Trong lúc chờ: game local vẫn chạy, nhưng KHÔNG deploy gì thêm.

  # ==============================================================================================
  # HIỆU NĂNG — cảnh báo, KHÔNG đánh thức ai
  # ==============================================================================================
  - name: hexagon-performance
    rules:
      # SLO doc 26 §2: stepRoom p95 > 5ms. `_max` là cận trên của p95, nên luật này nhạy hơn SLO —
      # cố ý, vì nó chỉ ghi cảnh báo chứ không gọi người.
      - alert: TickStepSlow
        expr: hexworld_tick_step_ms_max > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "stepRoom chậm: {{ $value }}ms"
          runbook: "Xem hexworld_rooms_active và số bot. Doc 26 §2 có bảng ngưỡng theo số phòng."

      - alert: EventLoopLagHigh
        expr: hexworld_eventloop_lag_ms_max > 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Event loop trễ {{ $value }}ms"
          description: >-
            HTTP và vòng lặp game 24Hz dùng CHUNG event loop khi SERVER_ROLE != "control".
            Một tác vụ đồng bộ nặng ở đường HTTP sẽ làm giật cả trận đấu.
          runbook: >-
            1) Xem có tác vụ đồng bộ nặng nào mới thêm ở đường HTTP không (JSON lớn, vòng lặp dài).
            2) Lát a3.3 đã chia nhỏ phép chạy lại replay vì đúng lý do này — kiểm xem có chỗ tương tự.
            3) Tách vai trò (SERVER_ROLE=control / game) là lời giải dài hạn.

      - alert: WebsocketDropRateHigh
        expr: >-
          sum(rate(hexworld_ws_dropped_total[5m]))
          / clamp_min(sum(rate(hexworld_ws_frames_total[5m])), 1) > 0.01
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Tỉ lệ rơi khung WebSocket {{ $value | humanizePercentage }}"
          runbook: >-
            Rơi khung do backpressure. Kiểm hexworld_ws_buffered_connections và
            hexworld_ws_bytes_per_second theo `kind` để biết loại bản tin nào đang phình.
