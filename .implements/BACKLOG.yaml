    depends_on: [r1-ci]
    dod:
      - "pnpm test:e2e:smoke"
    risk: low
    requires_human: false
    note: >
      Mở `/` và `/play`; assert canvas dựng được (VÀ có ngữ cảnh WebGL sống), HUD có mặt,
      console không có lỗi, vòng lặp render còn chạy sau 5 giây.
      BỐN thứ phải đúng, mỗi thứ đều đã làm bài này ĐỎ GIẢ ít nhất một lần trong lúc dựng:
      (1) `channel: "chromium"` — mặc định mới của Playwright là headless-shell KHÔNG có WebGL;
      (2) cổng RIÊNG 3877 + `reuseExistingServer: false` — bám vào dev server có sẵn ở 3890 khiến
          bài kiểm đo nhầm một bản build khác (một lần đo đúng màn hình lỗi của dev server);
      (3) lọc tiếng ồn theo ORIGIN chứ không theo regex chuỗi lỗi — thông điệp của Chromium là
          "Failed to load resource: net::ERR_CONNECTION_REFUSED", KHÔNG kèm URL, nên regex theo
          cổng 8910 không khớp gì cả;
      (4) chờ bằng `expect.poll` trên KÍCH THƯỚC canvas — `app/loading.tsx` + suspense của React giữ
          canvas trong wrapper `display:none`, ở đó Playwright coi là "visible" nhưng boundingBox = 0.
      `data-testid="hud-stats"` thêm vào HUD vì HUD là fragment, không có phần tử gốc để bám; một
      smoke test bám vào regex trên innerText sẽ mục ngay lần đổi copy đầu tiên.
      Timeout 120s dựa trên số ĐO ĐƯỢC, và hai lần đo lệch xa nhau: máy dev (Windows, SwiftShader)
      mất 30–45 giây để `/play` vẽ khung hình đầu, còn runner ubuntu-latest chỉ 8,0 giây cho cả bài.
      Chi phí thật không suy ra được từ "có GPU hay không" — nó phụ thuộc máy, nên để rộng.
      Đã chạy 3 lần liên tiếp trên máy dev (xanh cả 3) và 1 lần trên CI (run 34197660719, xanh).
      GIỚI HẠN ĐÃ BIẾT: `next.config` đặt `output: "standalone"` nên `next start` in cảnh báo; nó
      vẫn phục vụ đúng bản build, nhưng artifact deploy thật là `.next/standalone/server.js` và
      tầng 1 KHÔNG chạm tới nó — smoke xanh không chứng minh artifact deploy chạy được.
