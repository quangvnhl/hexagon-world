      hứa đó là một câu sai — và đó là loại sai đắt nhất trong một chính sách riêng tư.
      "Xoá hẳn" KHÔNG thể là `delete from players`: lược đồ đã mã hoá sẵn chính sách kế toán bằng
      khoá ngoại ON DELETE RESTRICT trên wallet_ledger, purchase_orders, player_energy_ledger.
      Nên `purge_deleted_players()` xoá dữ liệu chơi + gỡ định danh và giữ chứng từ trên một hàng
      người chơi vô danh — đúng những gì /privacy đã nói trước.
      Đã kiểm trên DB dev bằng giao dịch ROLLBACK: purge 1 tài khoản ⇒ định danh còn 0, thống kê
      còn 0, tên thành "Deleted Player", purged_at có, chạy lần hai trả 0 (idempotent). Rollback
      xong còn sót 0 hàng. KHÔNG chạy purge thật: 0 tài khoản trên dev đủ điều kiện, và AGENTS.md
      §1 cấm xoá dữ liệu người chơi.
      3 test khoá con số 30 ngày ở BA nơi (legal.ts ↔ hằng số controller ↔ mặc định trong SQL) và
      1 test chặn việc lỡ thêm bảng chứng từ vào danh sách xoá.
      CÒN THIẾU MỘT VIỆC CỦA NGƯỜI: purge chưa có lịch chạy (doc 37 Việc 3d). Chừng nào chưa bấm,
      câu trên trang /privacy vẫn chưa đúng.
    status: done
