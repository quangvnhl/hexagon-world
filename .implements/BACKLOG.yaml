  - id: b1-rewarded-ads-that
    doc: "35#B1"
    title: "Rewarded ads cấp thưởng thật — webhook S2S idempotent theo impression_id"
    files:
      - supabase/migrations/
      - packages/server/src/ads/
      - packages/server/test/
      - packages/client/src/
    depends_on: [b9-bang-kinh-te]
