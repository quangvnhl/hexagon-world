      mọi khoá mang nhãn platform từ đầu.
      Bảng remote_config để TRỐNG có chủ ý — seed sẵn sẽ tạo hai nguồn sự thật cho cùng một con số.
      Kèm remote_config_audit + trigger ghi giá trị trước/sau (kill-switch bị bấm lúc đang hoảng,
      hôm sau không ai nhớ ai bấm gì).
