  - id: b9-bang-kinh-te
    doc: "35#B9"
    title: "Bảng theo dõi kinh tế — coin phát hành theo nguồn vs tiêu theo sink"
    files:
      - supabase/migrations/
      - packages/server/src/admin/admin.controller.ts
      - packages/server/src/admin/economy.service.ts
      - packages/server/test/
      - packages/admin/src/
    depends_on: []
    dod:
      - "pnpm --filter @hexagon/server test"
      - "GET internal/v1/admin/economy/daily trả phát hành/tiêu/lạm phát theo ngày"
    risk: low
    requires_human: false
    note: |
      DỰNG TRƯỚC B1–B4 (doc 35 Rủi ro #4). Không có bảng này thì thêm bốn nguồn thưởng cùng
      lúc là thả coin vào một cái thùng không đáy mà không ai đo được.

      ĐO ĐƯỢC trên DB dev (2026-09-10): `wallet_ledger` đang có 4 reason —
      campaign_reward (+2090), `dev top-up` (+10000), energy_purchase (-700),
      telegram_stars_purchase (+5050).

      CHÚ Ý một lệch chuẩn có thật: `dev top-up` có DẤU CÁCH và không theo snake_case như ba
      cái kia. View phải chịu được điều đó thay vì giả định tên đẹp — và đây chính là lý do
      phân loại nguồn/sink phải dựa trên DẤU của `delta` là chính, `reason` chỉ để chia nhóm.
      Một `reason` lạ chưa từng thấy phải rơi vào nhóm "khác" và HIỆN RA, không được im lặng
      biến mất khỏi tổng.

      LÀM XONG — điều chỉnh so với ghi chú ban đầu: phân loại bám `reference_type` chứ không
      bám `reason`. Đo trên DB: reference_type toàn snake_case (campaign_play, admin_grant,
      energy_purchase, purchase_order) và nằm trong ràng buộc duy nhất của bảng, tức là cột CÓ
      CẤU TRÚC; `reason` là chữ tự do và chính là chỗ có `dev top-up`.
      Chiều tiền vẫn lấy từ dấu của `delta` đúng như ghi chú gốc.
    status: done

