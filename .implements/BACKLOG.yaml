      - "pnpm --filter @hexagon/server test"
      - "callback giả (sai chữ ký) KHÔNG cấp coin; gửi lặp cùng impression_id không cộng hai lần"
    risk: high
    requires_human: true
    human_note: |
      PHẦN PRODUCTION (làm sau): cấu hình Reward URL trong bảng điều khiển AdsGram trỏ tới
      `POST /v1/webhooks/adsgram` của domain thật, và lấy secret ký.
      Phần LOCAL làm được trọn vẹn: webhook, verify chữ ký, RPC idempotent, trần 5 lượt/ngày
      + giãn 3 phút, và test bắn callback giả lẫn callback lặp.
    note: |
      Rủi ro cao vì đây là một đường CẤP TIỀN mở ra Internet, do bên thứ ba gọi. Idempotency
      theo `impression_id` và verify chữ ký là hai chốt chặn, không phải một.
      Trần lấy từ remote config (A2) chứ không gõ cứng — chốt #5: 5 lượt/ngày, giãn ≥ 3 phút,
      ngày tính theo UTC (chốt #3).
    status: todo

