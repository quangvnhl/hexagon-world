# BACKLOG — đơn vị VIỆC máy đọc được (doc 36 R4)
#
# Phân vai:
#   .implements/*.md  = nguồn sự thật về THIẾT KẾ (vì sao, làm thế nào)
#   BACKLOG.yaml      = nguồn sự thật về VIỆC (làm gì, chạm file nào, xong là gì)
#   AGENTS.md         = luật thi công (cấm gì, bắt buộc gì)
#
# Quy tắc bắt buộc (đầy đủ trong AGENTS.md):
#   - Một lát = một phiên agent. Agent CHỈ được sửa các đường dẫn trong `files`.
#   - Cần chạm file ngoài `files` ⇒ cập nhật lát này TRƯỚC (thành một diff nhìn thấy được).
#   - `dod` là LỆNH CHẠY ĐƯỢC. Đỏ = chưa xong. Không có lệnh = lát chưa sẵn sàng giao.
#   - Agent thực thi KHÔNG chạy lệnh git. Chỉ orchestrator commit/gộp.
#   - Mặc định chạy TUẦN TỰ. Song song chỉ khi `files` rời nhau + mỗi agent một worktree.
#
# Trường của một lát:
#   id              mã lát, cũng là tên nhánh `slice/<id>` (viết thường)
#   doc             "<số doc>#<mục>" — đọc trước khi code
#   title           mô tả ngắn
#   files           đường dẫn được phép sửa (file chưa tồn tại = sẽ tạo mới)
#   depends_on      danh sách id phải `done` trước
#   dod             lệnh nghiệm thu, chạy hết phải xanh
#   risk            low | medium | high  (high ⇒ người duyệt trước khi gộp)
#   requires_human  true ⇒ có phần agent KHÔNG tự làm được (hạ tầng ngoài, pháp lý, giá cả,
#                   cảm giác chơi). Ghi rõ phần đó ở `human_note`.
#   status          todo | doing | done | blocked
#   commit          sha khi gộp vào main (orchestrator điền)

